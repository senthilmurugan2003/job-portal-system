<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPortal | Company Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Recruiter CSS -->
    <link rel="stylesheet" href="../../css/recruiter.css">
    <style>
        .company-form-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }
        .form-label {
            font-weight: 600;
            color: #2c3e50;
            margin-top: 15px;
        }
        .btn-custom-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-custom-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
            color: #fff;
        }
    </style>
</head>

<body>
    <!-- Background Animation -->
    <div class="background-animation">
        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>
    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">
                <i class="bi bi-building"></i>
            </div>
            <h3>JobPortal</h3>
        </div>

        <ul class="menu">
            <li>
                <a href="dashboard.html">
                    <i class="bi bi-grid"></i>
                    Dashboard
                </a>
            </li>
            <li class="active">
                <a href="company.html">
                    <i class="bi bi-building"></i>
                    Company Profile
                </a>
            </li>
            <li>
                <a href="post-job.html">
                    <i class="bi bi-plus-circle"></i>
                    Post Job
                </a>
            </li>
            <li>
                <a href="applicants.html">
                    <i class="bi bi-people"></i>
                    Applicants
                </a>
            </li>
        </ul>

        <div class="logout">
            <a href="#" id="logoutBtn">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <section class="main-content">
        <nav class="top-navbar">
            <div>
                <h2>Company Profile 🏢</h2>
                <p>Manage your organization details</p>
            </div>

            <div class="user-profile">
                <img id="headerAvatar" src="https://ui-avatars.com/api/?name=Recruiter" alt="profile">
                <div>
                    <h6 id="headerUserName">Recruiter</h6>
                    <span>Company Admin</span>
                </div>
            </div>
        </nav>

        <!-- Status Alerts -->
        <div id="alertMessage" class="alert d-none" role="alert"></div>

        <!-- Company Details Form -->
        <div class="company-form-card">
            <h4 class="mb-4 text-primary"><i class="bi bi-building-add me-2"></i>Organization Info</h4>

            <form id="companyForm">
                <div class="row">
                    <div class="col-md-6">
                        <label for="companyName" class="form-label">Company Name *</label>
                        <input type="text" id="companyName" class="form-control" placeholder="Acme Technologies Inc." required>
                    </div>
                    <div class="col-md-6">
                        <label for="location" class="form-label">Headquarters / Location</label>
                        <input type="text" id="location" class="form-control" placeholder="New York, USA / Remote">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12">
                        <label for="website" class="form-label">Official Website URL</label>
                        <input type="url" id="website" class="form-control" placeholder="https://www.company.com">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Company Overview / About Us</label>
                    <textarea id="description" class="form-control" rows="4" placeholder="Tell candidates about your company mission, tech stack, culture, and benefits..."></textarea>
                </div>

                <button type="submit" id="saveCompanyBtn" class="btn-custom-primary mt-2">
                    <i class="bi bi-check-lg me-1"></i> Save Company Profile
                </button>
            </form>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/auth-guard.js" data-required-role="recruiter"></script>
    <script src="../../js/company.js"></script>
</body>

</html>
