<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPortal | Reset Password</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-body">

    <!-- Background Video -->
    <video class="background-video" autoplay muted loop playsinline>
        <source src="../assets/videos/background.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <!-- Dark Overlay -->
    <div class="video-overlay"></div>
    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>
    <div class="background-shape shape-three"></div>

    <!-- Back To Login -->
    <a href="login.html" class="back-home">
        <i class="bi bi-arrow-left"></i>
        Back to Login
    </a>

    <!-- Main Container -->
    <main class="auth-container">
        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                <div class="logo-icon">
                    <i class="bi bi-briefcase-fill"></i>
                </div>
                <span>JobPortal</span>
            </div>

            <!-- Heading -->
            <div class="auth-heading">
                <h1>Set New Password</h1>
                <p>Create a strong password to protect your account</p>
            </div>

            <!-- Invalid Token Alert -->
            <div id="invalidTokenBox" class="alert alert-danger d-none" style="font-size: 0.9rem; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fecaca; border-radius: 10px;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="invalidTokenMsg">Invalid or missing reset token. Please request a new link.</span>
                <div class="mt-2">
                    <a href="forgot-password.html" class="btn btn-sm btn-outline-light">Request New Link</a>
                </div>
            </div>

            <!-- Reset Password Form -->
            <form id="resetPasswordForm">
                <!-- New Password -->
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrapper">
                        <i class="bi bi-lock input-icon"></i>
                        <input
                            type="password"
                            id="newPassword"
                            class="form-control"
                            placeholder="At least 6 characters"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" id="toggleNewPassword" class="password-toggle" aria-label="Show password">
                            <i id="newPasswordIcon" class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <div class="input-wrapper">
                        <i class="bi bi-shield-lock input-icon"></i>
                        <input
                            type="password"
                            id="confirmNewPassword"
                            class="form-control"
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" id="toggleConfirmNewPassword" class="password-toggle" aria-label="Show password">
                            <i id="confirmNewPasswordIcon" class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="resetBtn" class="auth-btn mt-3">
                    <span id="resetText">Reset Password</span>
                    <span id="resetLoader" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                </button>
            </form>

            <!-- Footer -->
            <div class="auth-footer">
                <p>
                    Back to
                    <a href="login.html">Sign In</a>
                </p>
            </div>

        </div>
    </main>

    <!-- Toast -->
    <div id="toast" class="toast-message" role="alert">
        <i id="toastIcon" class="bi bi-check-circle-fill"></i>
        <span id="toastText"></span>
    </div>

    <!-- JavaScript -->
    <script src="../js/auth.js"></script>
</body>

</html>
