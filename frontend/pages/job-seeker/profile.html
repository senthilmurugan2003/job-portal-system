<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPortal | My Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="../../css/dashboard.css">
    <!-- Custom styling for profile form -->
    <style>
        .profile-card-full {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }
        .form-label {
            font-weight: 600;
            color: #2c3e50;
            margin-top: 15px;
        }
        .btn-custom-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-custom-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
            color: #fff;
        }
        .resume-badge {
            background: #e0e7ff;
            color: #4338ca;
            padding: 8px 16px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <!-- Background Animation -->
    <div class="background-animation">
        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>
        <div class="circle circle-three"></div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">
                <i class="bi bi-briefcase-fill"></i>
            </div>
            <h3>JobPortal</h3>
        </div>

        <ul class="menu">
            <li>
                <a href="dashboard.html">
                    <i class="bi bi-grid"></i>
                    Dashboard
                </a>
            </li>
            <li class="active">
                <a href="profile.html">
                    <i class="bi bi-person"></i>
                    My Profile
                </a>
            </li>
            <li>
                <a href="jobs.html">
                    <i class="bi bi-search"></i>
                    Find Jobs
                </a>
            </li>
            <li>
                <a href="applications.html">
                    <i class="bi bi-file-earmark-text"></i>
                    Applications
                </a>
            </li>
        </ul>

        <div class="logout">
            <a href="#" id="logoutBtn">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <section class="main-content">
        <!-- Top Navbar -->
        <nav class="top-navbar">
            <div>
                <h2>My Profile 👤</h2>
                <p>Manage your professional details & resume</p>
            </div>

            <div class="user-profile">
                <img id="headerAvatar" src="https://ui-avatars.com/api/?name=User" alt="profile">
                <div>
                    <h6 id="headerUserName">User Name</h6>
                    <span>Job Seeker</span>
                </div>
            </div>
        </nav>

        <!-- Status Alerts -->
        <div id="alertMessage" class="alert d-none" role="alert"></div>

        <!-- Profile Form Card -->
        <div class="profile-card-full">
            <h4 class="mb-4 text-primary"><i class="bi bi-person-lines-fill me-2"></i>Personal Details</h4>
            
            <form id="profileForm">
                <div class="row">
                    <div class="col-md-6">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="text" id="phone" class="form-control" placeholder="+1 234 567 890">
                    </div>
                    <div class="col-md-6">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" id="location" class="form-control" placeholder="City, Country">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <label for="qualification" class="form-label">Highest Qualification</label>
                        <input type="text" id="qualification" class="form-control" placeholder="B.Tech Computer Science / MCA">
                    </div>
                    <div class="col-md-6">
                        <label for="experience" class="form-label">Experience</label>
                        <input type="text" id="experience" class="form-control" placeholder="e.g. 2 Years / Fresher">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <label for="skills" class="form-label">Technical / Key Skills</label>
                        <input type="text" id="skills" class="form-control" placeholder="e.g. Python, Flask, MySQL, Docker">
                    </div>
                    <div class="col-md-6">
                        <label for="preferredRole" class="form-label">Preferred Job Role</label>
                        <input type="text" id="preferredRole" class="form-control" placeholder="e.g. Python Developer / Data Scientist">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="bio" class="form-label">Professional Summary / Bio</label>
                    <textarea id="bio" class="form-control" rows="3" placeholder="Brief overview of your skills, background, and career goals..."></textarea>
                </div>

                <button type="submit" id="saveProfileBtn" class="btn-custom-primary mt-2">
                    <i class="bi bi-check-lg me-1"></i> Save Changes
                </button>
            </form>
        </div>

        <!-- Resume Upload Card -->
        <div class="profile-card-full">
            <h4 class="mb-4 text-primary"><i class="bi bi-file-earmark-pdf-fill me-2"></i>Resume Document</h4>

            <form id="resumeForm" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="resumeFile" class="form-label">Upload Resume File (PDF, DOC, DOCX - Max 5MB)</label>
                    <input type="file" id="resumeFile" class="form-control" accept=".pdf,.doc,.docx" required>
                </div>

                <div id="currentResumeContainer" class="mb-3 d-none">
                    <span class="text-muted small d-block">Current Resume:</span>
                    <a id="currentResumeLink" href="#" target="_blank" class="resume-badge">
                        <i class="bi bi-file-earmark-pdf"></i>
                        <span id="currentResumeName">View Resume</span>
                        <i class="bi bi-box-arrow-up-right ms-1"></i>
                    </a>
                </div>

                <button type="submit" id="uploadResumeBtn" class="btn-custom-primary">
                    <i class="bi bi-cloud-upload me-1"></i> Upload Resume
                </button>
            </form>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/auth-guard.js" data-required-role="job_seeker"></script>
    <script src="../../js/profile.js"></script>
</body>

</html>
