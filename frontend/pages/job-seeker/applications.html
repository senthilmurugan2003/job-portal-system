<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPortal | My Applications</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="../../css/dashboard.css">
    <!-- Applications CSS -->
    <link rel="stylesheet" href="../../css/applications.css">
</head>

<body>
    <!-- Background Animation -->
    <div class="background-animation">
        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">
                <i class="bi bi-briefcase-fill"></i>
            </div>
            <h3>JobPortal</h3>
        </div>

        <ul class="menu">
            <li>
                <a href="dashboard.html">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>
            </li>
            <li>
                <a href="profile.html">
                    <i class="bi bi-person"></i>
                    My Profile
                </a>
            </li>
            <li>
                <a href="jobs.html">
                    <i class="bi bi-search"></i>
                    Browse Jobs
                </a>
            </li>
            <li class="active">
                <a href="applications.html">
                    <i class="bi bi-file-earmark-text"></i>
                    My Applications
                </a>
            </li>
        </ul>

        <div class="logout">
            <a href="#" id="logoutBtn">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <div>
                <h2>Applied Jobs Tracker 📋</h2>
                <p>Track the status of all your job applications</p>
            </div>
        </div>

        <div id="applicationsContainer" class="applications-container">
            <div class="loading text-center p-4">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Loading your applications...</p>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/auth-guard.js" data-required-role="job_seeker"></script>
    <script src="../../js/applications.js"></script>
</body>

</html>
