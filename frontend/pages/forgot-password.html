<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPortal | Forgot Password</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-body">

    <!-- Background Video -->
    <video class="background-video" autoplay muted loop playsinline>
        <source src="../assets/videos/background.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <!-- Dark Overlay -->
    <div class="video-overlay"></div>
    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>
    <div class="background-shape shape-three"></div>

    <!-- Back To Login -->
    <a href="login.html" class="back-home">
        <i class="bi bi-arrow-left"></i>
        Back to Login
    </a>

    <!-- Main Container -->
    <main class="auth-container">
        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                <div class="logo-icon">
                    <i class="bi bi-briefcase-fill"></i>
                </div>
                <span>JobPortal</span>
            </div>

            <!-- Heading -->
            <div class="auth-heading">
                <h1>Forgot Password?</h1>
                <p>Enter your email to receive a password reset link</p>
            </div>

            <!-- Form -->
            <form id="forgotPasswordForm">
                <!-- Email -->
                <div class="form-group">
                    <label for="forgotEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="bi bi-envelope input-icon"></i>
                        <input
                            type="email"
                            id="forgotEmail"
                            class="form-control"
                            placeholder="Enter your registered email"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <!-- Info Message Box (Success State) -->
                <div id="forgotSuccessBox" class="alert alert-success d-none mt-3" style="font-size: 0.9rem; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #d1fae5; border-radius: 10px;">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span>A password reset link has been sent to your email address. Please check your inbox and spam folder.</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="forgotBtn" class="auth-btn mt-3">
                    <span id="forgotText">Send Reset Link</span>
                    <span id="forgotLoader" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                </button>
            </form>

            <!-- Back to Login Link -->
            <div class="auth-footer">
                <p>
                    Remember your password?
                    <a href="login.html">Login here</a>
                </p>
            </div>

        </div>
    </main>

    <!-- Toast -->
    <div id="toast" class="toast-message" role="alert">
        <i id="toastIcon" class="bi bi-check-circle-fill"></i>
        <span id="toastText"></span>
    </div>

    <!-- JavaScript -->
    <script src="../js/auth.js"></script>
</body>

</html>
